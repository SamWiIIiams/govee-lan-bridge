# Example stack (Portainer: Stacks -> Add stack -> Web editor).
services:
  govee-lan-bridge:
    container_name: govee-lan-bridge
    image: swilli23/govee-lan-bridge:2
    restart: unless-stopped
    network_mode: host            # reaches the MQTT broker, govee2mqtt and the lights on the LAN
    volumes:
      - /path/to/govee-lan-bridge:/config   # created automatically; devices.toml is generated here
    environment:
      MQTT_HOST: 127.0.0.1                  # the broker Home Assistant uses
      GOVEE2MQTT_URL: http://127.0.0.1:8056 # govee2mqtt's web UI; lights are discovered from it
      # Broker credentials, if it requires authentication. Set MQTT_USER / MQTT_PASS in a .env file next
      # to this one (Portainer: the stack's "Environment variables" section); leave unset for no auth.
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASS: ${MQTT_PASS:-}
